# Static site server (inside the container). TLS + the public door are handled by the
# framework's shared edge proxy; this just serves the files on :80.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Serve /about as about.html too (the pages link with .html, but clean URLs also work).
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Long-cache static assets (css/js/images); HTML stays fresh so edits show on redeploy.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1024;

    # Small hardening for a static marketing site.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
