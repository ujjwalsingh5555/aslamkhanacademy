# Static site server (inside the container). TLS + the public door are handled by the
# framework's shared edge proxy; this just serves the files on :80.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # --- SEO 301s: mirrors .htaccess. Legacy keyword pages under /seo/*.html redirect to the
    #     three canonical hubs. The hubs (/seo/varanasi/*), the SEO index, and _templates are
    #     served as-is via higher-priority exact/prefix matches (regex is only reached otherwise).
    location = /seo/index.html   { try_files $uri =404; }
    location ^~ /seo/_templates/ { try_files $uri $uri/ =404; }
    location ^~ /seo/varanasi/   { try_files $uri $uri/ =404; }
    location ~* ^/seo/.*data-analyst.*\.html$   { return 301 /seo/varanasi/data-analytics/; }
    location ~* ^/seo/.*(web|website).*\.html$  { return 301 /seo/varanasi/web-development/; }
    location ~* ^/seo/.*\.html$                 { return 301 /seo/varanasi/it-training/; }

    # Long-cache static assets; HTML stays fresh so edits show on redeploy.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Serve /about as about.html too (pages link with .html, but clean URLs also work).
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
